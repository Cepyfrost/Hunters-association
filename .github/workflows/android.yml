name: Build Hunter's Association APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Verify HTML
        run: |
          find . -type f \( -name "*.html" -o -name "*.htm" \) -print

      - name: Find launcher icon
        run: |
          ICON=$(find . -type f \( -iname "ICLauncherMaster.png" -o -iname "ic_launcher_master.png" \) | head -n 1)
          if [ -z "$ICON" ]; then
            echo "Launcher icon not found"
            find . -type f | sort
            exit 1
          fi
          echo "Found launcher icon: $ICON"
          cp "$ICON" /tmp/ICLauncherMaster.png

      - name: Create Android project
        run: |
          mkdir -p app/src/main/java/com/huntersassociation/app
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/mipmap-mdpi
          mkdir -p app/src/main/res/mipmap-xhdpi
          mkdir -p app/src/main/res/mipmap-xxhdpi
          mkdir -p app/src/main/res/mipmap-xxxhdpi
          mkdir -p app/src/main/res/values

          HTML=$(find . -type f \( -name "*.html" -o -name "*.htm" \) | head -n 1)

          if [ -z "$HTML" ]; then
            echo "HTML file not found"
            exit 1
          fi

          cp "$HTML" app/src/main/assets/index.html

      - name: Install launcher icon
        run: |
          cp /tmp/ICLauncherMaster.png app/src/main/res/drawable/ic_launcher.png

      - name: Create MainActivity
        run: |
          cat > app/src/main/java/com/huntersassociation/app/MainActivity.java <<'EOF'
          package com.huntersassociation.app;

          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
              private WebView web;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  web = new WebView(this);
                  setContentView(web);

                  WebSettings settings = web.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setBuiltInZoomControls(false);
                  settings.setDisplayZoomControls(false);

                  web.setWebViewClient(new WebViewClient());
                  web.loadUrl("file:///android_asset/index.html");
              }

              @Override
              public void onBackPressed() {
                  if (web.canGoBack()) {
                      web.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

      - name: Create resources
        run: |
          cat > app/src/main/res/values/colors.xml <<'EOF'
          <resources>
              <color name="icon_background">#000000</color>
          </resources>
          EOF

      - name: Create AndroidManifest
        run: |
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.VIBRATE" />

              <application
                  android:allowBackup="true"
                  android:label="Hunter's Association"
                  android:theme="@style/AppTheme"
                  android:icon="@drawable/ic_launcher"
                  android:roundIcon="@drawable/ic_launcher"
                  android:usesCleartextTraffic="true"
                  android:hardwareAccelerated="true">

                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="portrait"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

      - name: Create styles
        run: |
          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowActionModeOverlay">true</item>
                  <item name="android:colorAccent">#7000FF</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:statusBarColor">#050510</item>
                  <item name="android:navigationBarColor">#050510</item>
              </style>
          </resources>
          EOF

      - name: Create root Gradle files
        run: |
          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "HuntersAssociation"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.6.1' apply false
          }
          EOF

      - name: Create app build.gradle
        run: |
          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.huntersassociation.app'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.huntersassociation.app'
                  minSdk 23
                  targetSdk 35
                  versionCode 2
                  versionName '1.1'
              }
          }
          EOF

      - name: Create Gradle wrapper
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Hunters-Association-APK
          path: app/build/outputs/apk/debug/app-debug.apk
