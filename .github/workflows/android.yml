name: Build Hunter's Association APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Create Android project
        run: |
          mkdir -p app/src/main/java/com/huntersassociation/app
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable

          cp MainActivity.java app/src/main/java/com/huntersassociation/app/MainActivity.java
          cp hunters_association_prototype.html app/src/main/assets/hunters_association_prototype.html
          cp ic_launcher_master.png app/src/main/res/drawable/ic_launcher_master.png

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "HuntersAssociation"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.6.1' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.huntersassociation.app'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.huntersassociation.v11'
                  minSdk 23
                  targetSdk 35
                  versionCode 2
                  versionName '1.1 Test'
              }
          }
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowActionModeOverlay">true</item>
                  <item name="android:colorAccent">#00AEEF</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.VIBRATE" />

              <application
                  android:allowBackup="true"
                  android:label="Hunter's Association"
                  android:icon="@drawable/ic_launcher_master"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
name: Build & Sign Hunter's Association APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

env:
  BUILD_TOOLS: "33.0.2"
  API_LEVEL: 33

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            .gradle
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: ${{ env.API_LEVEL }}
          build-tools: ${{ env.BUILD_TOOLS }}
          components: platform-tools

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Decode existing release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > /tmp/release-keystore.jks

      - name: Assemble release
        run: ./gradlew --no-daemon assembleRelease

      - name: Locate release APK
        id: find-apk
        run: |
          apk=$(find app/build/outputs/apk/release -type f -name "*.apk" | head -n 1)

          if [ -z "$apk" ]; then
            echo "No release APK found."
            exit 1
          fi

          echo "apk=$apk" >> "$GITHUB_OUTPUT"

      - name: Sign APK with existing release key
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          unsigned="${{ steps.find-apk.outputs.apk }}"
          out="app/build/outputs/apk/release/hunters-association-v1.1-signed.apk"

          apksigner="$ANDROID_SDK_ROOT/build-tools/${BUILD_TOOLS}/apksigner"

          "$apksigner" sign \
            --ks /tmp/release-keystore.jks \
            --ks-pass pass:"$KEYSTORE_PASSWORD" \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass pass:"$KEY_PASSWORD" \
            --out "$out" \
            "$unsigned"

      - name: Verify APK
        run: |
          apksigner="$ANDROID_SDK_ROOT/build-tools/${BUILD_TOOLS}/apksigner"

          "$apksigner" verify \
            --verbose \
            "app/build/outputs/apk/release/hunters-association-v1.1-signed.apk"

      - name: Upload V1.1 APK
        uses: actions/upload-artifact@v4
        with:
          name: hunters-association-v1.1
          path: app/build/outputs/apk/release/hunters-association-v1.1-signed.apk
